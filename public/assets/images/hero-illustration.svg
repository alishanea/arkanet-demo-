  <text x="448" y="128" fill="#0B1F3A" font-family="sans-serif" font-size="14" font-weight="bold">Sub-50ms</text>

  <rect x="172" y="164" width="392" height="196" rx="8" fill="#071527" stroke="#16345F"/>
  <text x="190" y="192" fill="#60A5FA" font-family="monospace" font-size="12">class ArkanetPipeline &lt; ProductionEngine &gt; {</text>
  <text x="210" y="214" fill="#AAB4C8" font-family="monospace" font-size="11">  async executeWorkflow(clientBrief) {</text>
  <text x="230" y="234" fill="#34D399" font-family="monospace" font-size="11">    const architecture = await this.discover(clientBrief);</text>
  <text x="230" y="254" fill="#34D399" font-family="monospace" font-size="11">    const productionBuild = await this.engineer(architecture);</text>
  <text x="230" y="274" fill="#FBBF24" font-family="monospace" font-size="11">    return this.deployWithZeroDowntime(productionBuild);</text>
  <text x="210" y="294" fill="#AAB4C8" font-family="monospace" font-size="11">  }</text>
  <text x="190" y="316" fill="#60A5FA" font-family="monospace" font-size="12">}</text>

